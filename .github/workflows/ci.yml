name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: make clean && make

      - name: Smoke test
        run: |
          ./aigrandom -v -c --seed 42 /tmp/test.aag
          test -f /tmp/test.aag

  format:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          FAILED=0
          for f in $(find . -name '*.c' -o -name '*.h' | grep -v './aiger\.'); do
            if ! clang-format --dry-run --Werror "$f"; then
              echo "::error file=$f::File not properly formatted"
              FAILED=1
            fi
          done
          exit $FAILED
